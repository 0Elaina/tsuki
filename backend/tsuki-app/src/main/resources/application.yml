spring:
  application:
    name: tsuki
  profiles:
    active: dev
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
      enum:
        fail-on-numbers-for-enums: true
  flyway:
    locations: classpath:db/migration

logging:
  file:
    name: "${TSUKI_LOG_FILE:logs/tsuki.log}"
  pattern:
    correlation: "[requestId=%X{requestId:-}] "
  logback:
    rollingpolicy:
      file-name-pattern: "${logging.file.name}.%d{yyyy-MM-dd}.%i.gz"
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 1GB

springdoc:
  paths-to-match: "/api/v1/**"
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    disable-swagger-default-url: true

---

spring:
  config:
    activate:
      on-profile: dev
    import:
      - optional:file:config/application-dev.yml
      - optional:file:./config/application-dev.yml
      - optional:file:../config/application-dev.yml

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
